version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
        # Download and install CockroachDB ccloud CLI binary for AWS Amplify environment
        - mkdir -p src/bin
        - curl -fL https://binaries.cockroachdb.com/ccloud/ccloud_linux-amd64_0.6.12.tar.gz | tar -xz
        - mv ccloud src/bin/ccloud
        - chmod +x src/bin/ccloud
    build:
      commands:
        - node scripts/generate-env.js
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
